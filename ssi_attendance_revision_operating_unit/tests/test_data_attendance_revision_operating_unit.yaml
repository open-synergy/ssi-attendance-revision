scenarios:
  - name: "Attendance Revision - Operating Unit: record has operating_unit_id"
    steps:
      - step: "Get default operating unit"
        action: "ref"
        xml_id: "operating_unit.main_operating_unit"
        save_as: "ou"

      - step: "Create employee job position"
        action: "create"
        model: "hr.job"
        save_as: "job"
        values:
          name: "Test Job AR OU"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee AR OU"
          job_id: "EVAL: registry['job'].id"

      - step: "Create attendance revision type"
        action: "create"
        model: "attendance_revision_type"
        save_as: "revision_type"
        values:
          name: "Test AR Type OU"
          code: "TARTOU"

      - step: "Create timesheet for employee"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: "2025-01-01"
          date_end: "2025-01-31"
          working_schedule_id: "REF: resource.resource_calendar_std"

      - step: "Create attendance revision with operating_unit_id"
        action: "create"
        model: "attendance_revision"
        save_as: "revision"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          type_id: "EVAL: registry['revision_type'].id"
          timesheet_id: "EVAL: registry['timesheet'].id"
          date: "2025-01-15"
          operating_unit_id: "EVAL: registry['ou'].id"

      - step: "Assert operating_unit_id is set"
        action: "assert"
        target: "revision"
        asserts:
          operating_unit_id:
            type: "value"
            operator: "is_truthy"

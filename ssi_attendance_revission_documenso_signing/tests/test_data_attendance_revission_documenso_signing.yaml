scenarios:
  - name: "Attendance Revision - Documenso Signing: has signing fields"
    steps:
      - step: "Create employee job position"
        action: "create"
        model: "hr.job"
        save_as: "job"
        values:
          name: "Test Job AR DS"

      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee AR DS"
          job_id: "EVAL: registry['job'].id"

      - step: "Create attendance revision type"
        action: "create"
        model: "attendance_revision_type"
        save_as: "revision_type"
        values:
          name: "Test AR Type DS"
          code: "TARTDS"

      - step: "Create timesheet for employee"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: "2026-01-01"
          date_end: "2026-01-31"
          working_schedule_id: "REF: resource.resource_calendar_std"

      - step: "Create attendance revision"
        action: "create"
        model: "attendance_revision"
        save_as: "revision"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          type_id: "EVAL: registry['revision_type'].id"
          timesheet_id: "EVAL: registry['timesheet'].id"
          date: "2026-01-15"

      - step: "Assert revision has documenso signing fields"
        action: "assert"
        target: "revision"
        asserts:
          state:
            type: "value"
            expected: "draft"
          signature_request_ids:
            type: "value"
            operator: "is_falsy"
          approval_signature_request_id:
            type: "value"
            operator: "is_falsy"
